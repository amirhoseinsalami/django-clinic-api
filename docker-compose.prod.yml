services:

  nginx:

    image:
      nginx:latest


    ports:

      - "80:80"


    volumes:

      - static_volume:/static

      - media_volume:/media

      - ./nginx.conf:/etc/nginx/conf.d/default.conf


    depends_on:

      - web
  #Django + Gunicorn
  web:

    build: .

    command:
      gunicorn
      config.wsgi:application
      --bind 0.0.0.0:8000


    env_file:
      - .env


    volumes:

      - static_volume:/app/staticfiles

      - media_volume:/app/media


    depends_on:

      - db



  db:

    image:
      postgres:16


    env_file:
      - .env


    volumes:

      - postgres_data:/var/lib/postgresql/data



volumes:

  postgres_data:

  static_volume:

  media_volume: